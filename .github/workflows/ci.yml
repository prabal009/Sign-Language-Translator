name: CI

on: [push, pull_request]

permissions:
  contents: read

env:
  UV_VERSION: '0.9.2'

defaults:
  run:
    shell: pwsh

# Hosted runners only. Tests and portable smoke do not use a physical camera.
jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0t64 libportaudio2 libegl1 \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0
      - name: Install locked runtime and dev wheels
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $tool = Join-Path $env:RUNNER_TEMP 'uv-tool'
          python -m venv $tool
          $toolPython = if ($IsWindows) { "$tool/Scripts/python.exe" } else { "$tool/bin/python" }
          & $toolPython -m pip install --only-binary=:all: "uv==$env:UV_VERSION"
          $locked = Join-Path $env:RUNNER_TEMP 'dev-requirements.txt'
          & $toolPython -m uv export --frozen --no-emit-project --only-group dev --format requirements-txt --output-file $locked
          python -m pip install --only-binary=:all: --require-hashes -r requirements.txt -r $locked
      - name: Check dependencies
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Run offline tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m 'not real_model'
      - name: Provision and verify pinned SignSpeak assets
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m utils.model_assets install
          python -m utils.model_assets verify
      - name: Run required real-model tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m real_model --require-real-model

  package:
    name: Portable build (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0t64 libportaudio2 libegl1 \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0
      - name: Install locked runtime and packaging wheels
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $tool = Join-Path $env:RUNNER_TEMP 'uv-tool'
          python -m venv $tool
          $toolPython = if ($IsWindows) { "$tool/Scripts/python.exe" } else { "$tool/bin/python" }
          & $toolPython -m pip install --only-binary=:all: "uv==$env:UV_VERSION"
          $locked = Join-Path $env:RUNNER_TEMP 'package-requirements.txt'
          & $toolPython -m uv export --frozen --no-emit-project --only-group package --format requirements-txt --output-file $locked
          python -m pip install --only-binary=:all: --require-hashes -r requirements.txt -r $locked
      - name: Provision verified assets and build native portable app
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip check
          python -m utils.model_assets install
          python -m utils.model_assets verify
          python -m PyInstaller --clean --noconfirm SignLanguageTranslator.spec
      - name: Stage portable app and report paths containing spaces
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'portable smoke'
          $work = Join-Path $smoke 'working directory'
          $artifact = Join-Path $env:RUNNER_TEMP 'package artifact'
          New-Item -ItemType Directory -Path $smoke, $work, $artifact | Out-Null
          Move-Item -LiteralPath 'dist/SignLanguageTranslator' -Destination $smoke
          @(
            "SMOKE_DIR=$smoke"
            "SMOKE_WORKDIR=$work"
            "SMOKE_REPORT=$(Join-Path $artifact 'smoke report.json')"
            "ARTIFACT_DIR=$artifact"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Smoke-test native Linux executable with only bundled assets
        if: runner.os == 'Linux'
        timeout-minutes: 3
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir "$SMOKE_DIR/empty app data"
          cd "$SMOKE_WORKDIR"
          XDG_DATA_HOME="$SMOKE_DIR/empty app data" \
            "$SMOKE_DIR/SignLanguageTranslator/SignLanguageTranslator" \
            --smoke-test --smoke-report "$SMOKE_REPORT"
      - name: Smoke-test windowed Windows executable with only bundled assets
        if: runner.os == 'Windows'
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Moving app-local assets is permitted only on an ephemeral GitHub-hosted runner.'
          }
          $models = python -c "from utils.model_assets import data_dir; print(data_dir() / 'models')"
          $backup = Join-Path $models ('ci-smoke-' + [guid]::NewGuid().ToString('N'))
          $names = @('signspeak_model.joblib', 'model_metadata.json')
          New-Item -ItemType Directory -Path $backup | Out-Null
          try {
            foreach ($name in $names) {
              Move-Item -LiteralPath (Join-Path $models $name) -Destination $backup
            }
            # Start-Process accepts the executable path directly, but joins its arguments into a command line.
            $exe = Join-Path $env:SMOKE_DIR 'SignLanguageTranslator/SignLanguageTranslator.exe'
            $arguments = @('--smoke-test', '--smoke-report', ('"{0}"' -f $env:SMOKE_REPORT))
            $process = Start-Process -FilePath $exe -ArgumentList $arguments `
              -WorkingDirectory $env:SMOKE_WORKDIR -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              if (Test-Path -LiteralPath $env:SMOKE_REPORT) {
                Get-Content -LiteralPath $env:SMOKE_REPORT
              }
              throw "Bundled smoke failed with exit code $($process.ExitCode)."
            }
          } finally {
            foreach ($name in $names) {
              $saved = Join-Path $backup $name
              if (Test-Path -LiteralPath $saved) {
                Move-Item -LiteralPath $saved -Destination $models
              }
            }
            Remove-Item -LiteralPath $backup
          }
          python -m utils.model_assets verify
      - name: Validate bundled smoke evidence
        run: |
          @'
          import json
          import os
          from pathlib import Path
          from string import ascii_uppercase

          report_path = Path(os.environ['SMOKE_REPORT'])
          assert report_path.is_file(), f'Missing smoke report: {report_path}'
          text = report_path.read_text(encoding='utf-8')
          print(text)
          report = json.loads(text)
          assert report['ok'] is True, report
          assert report['label'] in tuple(ascii_uppercase), report
          assert report['mediapipe_initialized'] is True, report
          assert report['camera_opened'] is False, report
          '@ | python -
      - name: Archive portable build and record sizes
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $extension = if ($IsWindows) { 'zip' } else { 'tar.gz' }
          $platform = $env:RUNNER_OS.ToLowerInvariant()
          $archive = Join-Path $env:ARTIFACT_DIR "SignLanguageTranslator-$platform-x64.$extension"
          tar -a -cf $archive -C $env:SMOKE_DIR SignLanguageTranslator
          $bundle = Join-Path $env:SMOKE_DIR 'SignLanguageTranslator'
          $bundleBytes = (Get-ChildItem -LiteralPath $bundle -Recurse -File -Force |
            Measure-Object -Property Length -Sum).Sum
          $archiveBytes = (Get-Item -LiteralPath $archive).Length
          @(
            "### $env:RUNNER_OS x64 portable build"
            '- Bundled SignSpeak smoke passed with offscreen Qt and no camera.'
            "- Bundle files: $bundleBytes bytes. Archive: $archiveBytes bytes."
            '- This verifies startup on the hosted runner, not end-user system libraries or hardware.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Upload passing portable build and smoke report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ runner.os }}-x64
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          compression-level: 0
