[project]
name = "sign-language-translator"
version = "0.1.0"
description = "Native desktop ISL fingerspelling and optional local gesture commands"
requires-python = ">=3.11,<3.13"
dependencies = [
    "joblib==1.4.2",
    "mediapipe==0.10.18",
    "numpy==1.26.4",
    "opencv-contrib-python==4.11.0.86",
    "PyQt6==6.9.1",
    "scikit-learn==1.6.1",
]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-qt==4.5.0", "ruff==0.13.3"]
package = ["PyInstaller==6.16.0"]

[tool.uv]
package = false
required-version = "==0.9.2"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
]
# Qt ABI and the MediaPipe / NumPy 1 / scikit-learn runtime stack.
constraint-dependencies = [
    "PyQt6-Qt6==6.9.1",
    "scipy==1.15.3",
    "jax==0.4.38",
    "jaxlib==0.4.38",
    "protobuf==4.25.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"

[tool.ruff]
target-version = "py311"
